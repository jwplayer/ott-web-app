name: Test - Unit, Integration, Snapshot

on:
  push:
    branches: ['develop', 'release']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ghapm:v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ghapm:v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # ghapm:v3
        with:
          install: false
      - name: pnpm install and test
        run: |
          pnpm install --frozen-lockfile
          pnpm test
        env:
          CI: true
