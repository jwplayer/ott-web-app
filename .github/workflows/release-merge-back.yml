name: Release - Merge Back to Dev
on:
  workflow_run:
    workflows: ['Release - Build Artifacts, Tag, and Release']
    branches: [release]
    types:
      - completed
  workflow_dispatch:

jobs:
  merge-back:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ghapm:v4

      - name: Merge release -> develop
        uses: devmasx/merge-branch@6ec8363d74aad4f1615d1234ae1908b4185c4313
        with:
          type: now
          from_branch: release
          target_branch: develop
          message: 'chore: merge release to develop'
          github_token: ${{ secrets.GITHUB_TOKEN }}
