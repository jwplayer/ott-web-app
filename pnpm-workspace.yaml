linkWorkspacePackages: true
packages:
  - configs/*
  - packages/*
  - platforms/*

overrides:
  # Fix vulnerabilities
  'fast-xml-parser': '>=4.5.4'
  'shell-quote': '>=1.8.4'
  'axios': '>=0.30.0'
  '@xmldom/xmldom': '>=0.9.10'
  # i18next-parser imports the default export, which was removed in cheerio 1.0.0
  'cheerio': '1.0.0-rc.12'

minimumReleaseAge: 10080 # 7 days

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  detox: true
  dtrace-provider: true
  esbuild: true
  sharp: true
