name: Test - Linting

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      - name: pnpm install, lint
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
        env:
          CI: true
