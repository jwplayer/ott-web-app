name: Web - Test - End to End

on:
  pull_request:
  push:
    branches: ['develop', 'release']
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./platforms/web

jobs:
  test-e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config: [desktop, mobile]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ghapm:v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ghapm:v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # ghapm:v3
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add -g wait-on
      - name: Start preview server
        run: pnpm start:test &
      - name: Run tests
        run: wait-on -v -t 60000 -c ./scripts/waitOnConfig.js http-get://localhost:8080 && pnpm codecept:${{ matrix.config }}
        env:
          TEST_RETRY_COUNT: 2
          WORKER_COUNT: 2
      - name: Uploading artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ghapm:v4
        with:
          name: allure-report-${{ matrix.config }}
          path: ./platforms/web/test-e2e/output/${{ matrix.config }}
          retention-days: 7
