name: Test - Unit, Integration, Snapshot

on:
  push:
    branches: ['develop', 'release']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm install and test
        run: |
          pnpm install --frozen-lockfile
          pnpm test
        env:
          CI: true
